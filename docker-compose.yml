services:
  smtp-mcp-server:
    image: ghcr.io/marco2901/smtp-mcp-server:latest
    container_name: smtp-mcp-server
    restart: unless-stopped
    environment:
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      # IMAP (reading) — falls IMAP_USER/PASS leer, werden SMTP_USER/PASS genutzt
      - IMAP_HOST=${IMAP_HOST}
      - IMAP_PORT=${IMAP_PORT:-993}
      - IMAP_SECURE=${IMAP_SECURE:-true}
      - IMAP_USER=${IMAP_USER}
      - IMAP_PASS=${IMAP_PASS}
      - MCP_API_KEY=${MCP_API_KEY}
      # Authelia OIDC – für Claude.ai OAuth
      # Authelia 4.39+: external HTTPS URL — internal http://authelia:9091
      # is rejected because the X-Forwarded-Proto header is missing/'http'.
      - OIDC_INTROSPECTION_URL=https://authelia.your-domain.com/api/oidc/introspection
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
    expose:
      - "3000"
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.smtp-mcp.rule=Host(`${MCP_DOMAIN}`)
      - traefik.http.routers.smtp-mcp.entrypoints=websecure
      - traefik.http.services.smtp-mcp.loadbalancer.server.port=3000
      - traefik.http.routers.smtp-mcp.tls.certresolver=mydnschallenge
      - traefik.http.routers.smtp-mcp.tls=true
      - traefik.http.routers.smtp-mcp.middlewares=middlewares-rate-limit@file,middlewares-secure-headers@file
    networks:
      - traefik

networks:
  traefik:
    external: true
